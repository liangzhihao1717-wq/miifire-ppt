<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第 17 页</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;

    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 6.875vw 10vw;
      background:
        radial-gradient(ellipse at 80% 30%, rgba(180,150,100,0.04) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .data-row {
      display: flex;
      align-items: baseline;
      gap: 1.5vw;
      margin-bottom: 1.5vw;
    }

    .data-num {
      font-size: 5vw;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .data-num.big {
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .data-num.dim {
      color: rgba(255,255,255,0.25);
    }

    .data-num.mid {
      color: rgba(255,255,255,0.45);
    }

    .data-desc {
      font-size: 1.1vw;
      font-weight: 400;
      color: rgba(255,255,255,0.40);
      letter-spacing: 0.05em;
    }

    .definition {
      font-size: 3vw;
      font-weight: 900;
      color: #e0ded5;
      letter-spacing: 0.06em;
      margin-bottom: 2.5vw;
      line-height: 1.3;
    }

    .definition .gold {
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 25vw;
      height: 0.16vw;
      background: rgba(255,255,255,0.18);
      margin-bottom: 2vw;
    }

    .closing {
      font-size: 1.5vw;
      font-weight: 500;
      color: rgba(255,255,255,0.68);
      letter-spacing: 0.04em;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 1;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="/ppt/" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">

      <div class="data-row">
        <span class="data-num big">1000</span>
        <span class="data-desc">条视频</span>
        <span class="data-num dim">→</span>
        <span class="data-num mid">200</span>
        <span class="data-desc">条带来客户</span>
        <span class="data-num dim">→</span>
        <span class="data-num mid">20</span>
        <span class="data-desc">条带来很多客户</span>
      </div>

      <div class="definition">
        能获得<span class="gold">信任</span>的短视频，<br>才叫<span class="gold">超级传单</span>
      </div>

      <div class="divider"></div>

      <div class="closing">这是我们拍短视频的唯一正确方向</div>

    </div>

    <div class="meta">— 互联网大厂 · 产品路演 —</div>
  </div>
</body>
</html>
