<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觅火 MIIFIRE 产品路演</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      padding: 6.875vw 10vw;
      background:
        radial-gradient(ellipse at 80% 30%, rgba(180,150,100,0.04) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    /* ====== 六词横排 + 分类标尺 ====== */
    .words-row {
      display: flex;
      align-items: flex-end;
      gap: 3vw;
      margin-bottom: 1.5vw;
    }

    .group-block {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.75vw;
    }
    .group-block .words {
      display: flex;
      gap: 2.5vw;
      justify-content: center;
    }

    .vline {
      width: 0.08vw;
      background: rgba(255,255,255,0.15);
      align-self: stretch;
      flex-shrink: 0;
    }
    .group-block .bar {
      height: 0.23vw;
      background: rgba(255,255,255,0.3);
    }
    .group-block .label {
      text-align: center;
      font-size: 2.25vw;
      font-weight: 900;
      letter-spacing: 0.14em;
      margin-top: 0.4vw;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .word-card {
      text-align: center;
      flex-shrink: 0;
    }
    .word-card .num {
      font-size: 1.56vw;
      font-weight: 300;
      font-style: italic;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.08em;
      margin-bottom: 0.4vw;
    }
    .word-card .cn {
      font-size: 2.625vw;
      font-weight: 900;
      color: #ece9e0;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 1;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="/ppt/" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">

      <div class="words-row">

        <div class="group-block">
          <div class="words">
            <div class="word-card">
              <div class="num">01</div>
              <div class="cn">超级传单</div>
            </div>
            <div class="word-card">
              <div class="num">02</div>
              <div class="cn">信任来源</div>
            </div>
          </div>
          <div class="bar"></div>
          <div class="label">方 向</div>
        </div>

        <div class="vline"></div>

        <div class="group-block">
          <div class="words">
            <div class="word-card">
              <div class="num">03</div>
              <div class="cn">开采手段</div>
            </div>
            <div class="word-card">
              <div class="num">04</div>
              <div class="cn">生产机器</div>
            </div>
            <div class="word-card">
              <div class="num">05</div>
              <div class="cn">简单拍剪</div>
            </div>
          </div>
          <div class="bar"></div>
          <div class="label">实 操</div>
        </div>

        <div class="vline"></div>

        <div class="group-block">
          <div class="words">
            <div class="word-card">
              <div class="num">06</div>
              <div class="cn">阶梯地图</div>
            </div>
          </div>
          <div class="bar"></div>
          <div class="label">路 线</div>
        </div>

      </div>

    </div>

    <div class="meta">— 互联网大厂 · 产品路演 —</div>
  </div>
</body>
</html>
