<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第 10 页</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;

    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 6.875vw 10vw;
      background:
        radial-gradient(ellipse at 80% 70%, rgba(180,150,100,0.04) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .table {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .header-row {
      display: grid;
      grid-template-columns: 11.25vw 0.65fr 1fr 1fr;
      gap: 2.5vw;
      padding-bottom: 1.25vw;
      border-bottom: 0.16vw solid rgba(255,255,255,0.22);
    }
    .header-row .col {
      font-size: 1.125vw;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.08em;
    }

    .row {
      display: grid;
      grid-template-columns: 11.25vw 0.65fr 1fr 1fr;
      gap: 2.5vw;
      padding: 2.5vw 0;
      border-bottom: 0.08vw solid rgba(255,255,255,0.08);
    }
    .row:last-child { border-bottom: none; }

    .row .scene-name {
      font-size: 1.56vw;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .row .col {
      font-size: 1.44vw;
      font-weight: 400;
      color: rgba(255,255,255,0.62);
      letter-spacing: 0.04em;
      line-height: 1.7;
    }

    .row .sell {
      font-size: 1.44vw;
      font-weight: 500;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
      line-height: 1.7;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 1;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="/ppt/" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="table">

      <div class="header-row">
        <div class="col">场景</div>
        <div class="col">画面</div>
        <div class="col">内容</div>
        <div class="col">传递的卖点</div>
      </div>

      <div class="row">
        <div class="scene-name">和客户谈方案</div>
        <div class="col">在公司或者工地上和客户面对面沟通</div>
        <div class="col">拿着图纸逐项解释每一个设计决策的原因，解释不同材料的价格差异和效果差异</div>
        <div class="sell">专业度高、透明报价、为客户考虑</div>
      </div>

      <div class="row">
        <div class="scene-name">材料验收</div>
        <div class="col">在仓库或工地门口，拆开刚到货的材料</div>
        <div class="col">检查材料规格、品牌、型号是否和合同一致，发现不对当场退换</div>
        <div class="sell">不偷工减料，对材料有标准</div>
      </div>

    </div>

    <div class="meta">— 互联网大厂 · 产品路演 —</div>
  </div>
</body>
</html>
