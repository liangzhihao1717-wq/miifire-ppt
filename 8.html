<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觅火 MIIFIRE 产品路演</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;

    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 6.875vw 10vw;
      background:
        radial-gradient(ellipse at 80% 30%, rgba(180,150,100,0.04) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .title {
      font-size: 4vw;
      font-weight: 900;
      color: #e0ded5;
      letter-spacing: 0.06em;
      margin-bottom: 0.75vw;
    }

    .divider {
      width: 25vw;
      height: 0.16vw;
      background: rgba(255,255,255,0.18);
      margin-bottom: 2.75vw;
    }

    .formula {
      display: flex;
      align-items: center;
      gap: 1.875vw;
      margin-bottom: 4.375vw;
    }

    .formula .term {
      font-size: 2.5vw;
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .formula .times {
      font-size: 1.75vw;
      color: rgba(255,255,255,0.30);
      font-weight: 300;
    }

    .example {
      display: flex;
      gap: 1.75vw;
      align-items: flex-start;
    }

    .example::before {
      content: '▶';
      flex-shrink: 0;
      font-size: 0.875vw;
      color: rgba(255,255,255,0.30);
      margin-top: 0.44vw;
    }

    .example .text {
      font-size: 1.5vw;
      font-weight: 500;
      color: rgba(255,255,255,0.70);
      letter-spacing: 0.04em;
      line-height: 1.8;
      max-width: 70vw;
    }

    .example .text em {
      font-style: normal;
      color: #d4b87a;
      font-weight: 700;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 1;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="/ppt/" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">

      <div class="title">你的信用是怎么累积的</div>

      <div class="divider"></div>

      <div class="formula">
        <span class="term">具象过程</span>
        <span class="times">✖</span>
        <span class="term">心智密度</span>
        <span class="times">✖</span>
        <span class="term">时间长度</span>
      </div>

      <div class="example">
        <div class="text">
          跟客户说「<em>我装修做得好</em>」，不如让客户看<em>我怎么验收工地</em>。<br>前者是推销，后者是展示。
        </div>
      </div>

    </div>

    <div class="meta">— 互联网大厂 · 产品路演 —</div>
  </div>
</body>
</html>
