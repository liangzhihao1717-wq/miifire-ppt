<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觅火 MIIFIRE 产品路演</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;

    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      padding: 6.875vw 10vw;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 80% 30%, rgba(180,150,100,0.04) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content {
      display: flex;
      align-items: center;
      height: 100%;
    }

    /* ====== 左侧 ====== */
    .left {
      flex: 0 0 72%;
      padding-right: 5vw;
    }

    /* 拒绝行 — 极简横删 */
    .deny-row {
      display: flex;
      gap: 2vw;
      margin-bottom: 3.75vw;
    }
    .deny-tag {
      font-size: 1.125vw;
      font-weight: 400;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.08em;
      text-decoration: line-through;
      text-decoration-thickness: 0.08vw;
      text-decoration-color: rgba(255,255,255,0.18);
    }

    /* 一级标题 */
    h1 {
      font-size: 4.5vw;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: 0.06em;
      color: #e8e8e4;
      margin-bottom: 2.5vw;
    }
    h1 em {
      font-style: normal;
      background: linear-gradient(135deg, #c9a050 0%, #f5e6c8 40%, #d4b87a 50%, #f5e6c8 60%, #c9a050 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* 二级标题 */
    .sub {
      font-size: 1.75vw;
      font-weight: 400;
      color: rgba(255,255,255,0.48);
      letter-spacing: 0.06em;
      display: flex;
      align-items: baseline;
      gap: 0.375vw;
    }
    .sub strong {
      font-weight: 900;
      font-size: 3.75vw;
      line-height: 1;
      background: linear-gradient(180deg, #b48b3a 0%, #f5e6c8 40%, #e2c988 50%, #f5e6c8 60%, #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ====== 右侧三条 ====== */
    .right {
      flex: 0 0 28%;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .pillar {
      padding: 1.75vw 0;
      display: flex;
      flex-direction: column;
      gap: 0.5vw;
      border-bottom: 0.08vw solid rgba(255,255,255,0.06);
    }
    .pillar:last-child { border-bottom: none; }
    .pillar .num {
      font-size: 0.875vw;
      font-weight: 400;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em;
    }
    .pillar .word {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 3vw;
      font-weight: 900;
      color: #e0ded5;
      letter-spacing: 0.1em;
      line-height: 1;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 1;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="/ppt/" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">

      <div class="left">
        <div class="deny-row">
          <span class="deny-tag">账号定位</span>
          <span class="deny-tag">人设选题</span>
          <span class="deny-tag">流量打法</span>
          <span class="deny-tag">AI获客</span>
        </div>

        <h1>不要给我讲<br><em>虚头巴脑</em>的东西</h1>

        <div class="sub">
          不要扯别的，我要<strong>落</strong>
        </div>
      </div>

      <div class="right">
        <div class="pillar">
          <div class="num">01 —</div>
          <div class="word">文案</div>
        </div>
        <div class="pillar">
          <div class="num">02 —</div>
          <div class="word">拍摄</div>
        </div>
        <div class="pillar">
          <div class="num">03 —</div>
          <div class="word">剪辑</div>
        </div>
      </div>

    </div>

    <div class="meta">— 互联网大厂 · 产品路演 —</div>
  </div>
</body>
</html>
