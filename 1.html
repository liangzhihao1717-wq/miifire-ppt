<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觅火 MIIFIRE 产品路演</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 6.875vw 12vw;
      background:
        radial-gradient(ellipse at 30% 70%, rgba(180,150,100,0.03) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 5vw;
    }

    /* --- 标题区 --- */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8vw;
    }

    .title {
      font-size: 5.2vw;
      font-weight: 900;
      letter-spacing: 0.18em;
      background: linear-gradient(180deg,
        #e8d5a3 0%,
        #d4b87a 35%,
        #c9a050 50%,
        #d4b87a 65%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tags {
      display: flex;
      gap: 3.5vw;
      font-size: 1.25vw;
      font-weight: 400;
      color: rgba(255,255,255,0.42);
      letter-spacing: 0.12em;
    }

    .tags span {
      display: flex;
      align-items: baseline;
      gap: 0.6vw;
    }

    .tags .bracket {
      color: rgba(212,184,122,0.50);
      font-weight: 300;
      font-size: 1.4vw;
    }

    .tags .keyword {
      font-weight: 700;
      font-size: 1.625vw;
      letter-spacing: 0.10em;
      background: linear-gradient(180deg,
        #e2c988 0%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tags .suffix {
      font-size: 1.25vw;
      font-weight: 400;
      color: rgba(255,255,255,0.42);
      letter-spacing: 0.12em;
    }

    /* --- 分割线 --- */
    .rule {
      width: 100%;
      height: 0.04vw;
      background: rgba(212,184,122,0.20);
    }

    /* --- 列表区 --- */
    .list-grid {
      display: flex;
      gap: 0;
    }

    .list-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2vw;
    }

    .col-rule {
      flex-shrink: 0;
      width: 0.04vw;
      background: rgba(212,184,122,0.18);
      margin: 0 4vw;
    }

    .list-item {
      display: flex;
      align-items: baseline;
      gap: 1.5vw;
    }

    .list-item .num {
      flex-shrink: 0;
      font-size: 0.875vw;
      font-weight: 300;
      color: rgba(212,184,122,0.35);
      letter-spacing: 0.08em;
      min-width: 2.5vw;
    }

    .list-item .text {
      font-size: 1.44vw;
      font-weight: 400;
      color: rgba(255,255,255,0.62);
      letter-spacing: 0.08em;
      line-height: 1.6;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 0.75;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.06);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="index.html" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">

      <div class="header">
        <div class="title">前情回顾</div>
        <div class="tags">
          <span><span class="bracket">[</span><span class="keyword">人设名片</span><span class="bracket">]</span><span class="suffix">短视频</span></span>
          <span><span class="bracket">[</span><span class="keyword">线索获客</span><span class="bracket">]</span><span class="suffix">短视频</span></span>
        </div>
      </div>

      <div class="rule"></div>

      <div class="list-grid">
        <div class="list-col">
          <div class="list-item">
            <span class="num">01</span>
            <span class="text">痛点讲述</span>
          </div>
          <div class="list-item">
            <span class="num">02</span>
            <span class="text">原料筹措</span>
          </div>
          <div class="list-item">
            <span class="num">03</span>
            <span class="text">产品 / 服务功能</span>
          </div>
          <div class="list-item">
            <span class="num">04</span>
            <span class="text">价值主张</span>
          </div>
        </div>

        <div class="col-rule"></div>

        <div class="list-col">
          <div class="list-item">
            <span class="num">05</span>
            <span class="text">客户故事</span>
          </div>
          <div class="list-item">
            <span class="num">06</span>
            <span class="text">稀缺/成果证明</span>
          </div>
          <div class="list-item">
            <span class="num">07</span>
            <span class="text">客户证明</span>
          </div>
        </div>

        <div class="col-rule"></div>

        <div class="list-col">
          <div class="list-item">
            <span class="num">08</span>
            <span class="text">Vlog证明</span>
          </div>
          <div class="list-item">
            <span class="num">09</span>
            <span class="text">事件发生</span>
          </div>
          <div class="list-item">
            <span class="num">10</span>
            <span class="text">花絮集锦</span>
          </div>
        </div>
      </div>

    </div>

    <div class="meta">— 互联网大厂 · 产品路演 —</div>
  </div>
</body>
</html>
