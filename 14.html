<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第 14 页</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;

    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 6.875vw 10vw;
      background:
        radial-gradient(ellipse at 80% 30%, rgba(180,150,100,0.04) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .title {
      font-size: 4vw;
      font-weight: 900;
      color: #e0ded5;
      letter-spacing: 0.06em;
      margin-bottom: 0.75vw;
    }

    .subtitle {
      font-size: 1.44vw;
      font-weight: 500;
      color: rgba(255,255,255,0.48);
      letter-spacing: 0.06em;
      margin-bottom: 0.5vw;
      display: flex;
      align-items: center;
      gap: 0.3vw;
    }

    .subtitle .inline-logo {
      height: 2.5vw;
      filter: brightness(0.95) saturate(0.4);
    }
    .subtitle .brand-name {
      font-weight: 700;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 25vw;
      height: 0.16vw;
      background: rgba(255,255,255,0.18);
      margin-bottom: 2.75vw;
    }

    .columns {
      display: flex;
      gap: 5vw;
    }
    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1vw;
    }

    .item {
      display: flex;
      align-items: baseline;
      gap: 0.75vw;
      font-size: 1.375vw;
      font-weight: 400;
      color: rgba(255,255,255,0.70);
      letter-spacing: 0.04em;
      line-height: 1.7;
    }

    .item .arrow {
      color: rgba(255,255,255,0.30);
      font-weight: 300;
      flex-shrink: 0;
    }

    .item .gold {
      font-weight: 700;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 1;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="/ppt/" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">

      <div class="title">开采手段和生产机器</div>

      <div class="subtitle">用 <img src="logo.png" class="inline-logo"> <span class="brand-name">觅火 MIIFIRE AI 智能体</span></div>

      <div class="divider"></div>

      <div class="columns">
        <div class="col">
          <div class="item">
            <span class="gold">把小事讲好</span>
            <span class="arrow">→</span>
            <span>「坚持」用嘴巴写日记</span>
          </div>
          <div class="item">
            <span class="gold">把想讲的讲好</span>
            <span class="arrow">→</span>
            <span>不要浪费自己的表达欲</span>
          </div>
          <div class="item">
            <span class="gold">把客户故事讲好</span>
            <span class="arrow">→</span>
            <span>每个客户都是你的内容供应商</span>
          </div>
        </div>
        <div class="col">
          <div class="item">
            <span class="gold">把产品/服务讲好</span>
            <span class="arrow">→</span>
            <span>每件新品讲一遍</span>
          </div>
          <div class="item">
            <span class="gold">把你出差过程讲好</span>
            <span class="arrow">→</span>
            <span>现场出稿子 / 现场拍</span>
          </div>
          <div class="item">
            <span class="gold">把低粉高赞讲好</span>
            <span class="arrow">→</span>
            <span>低粉高赞短视频</span>
          </div>
        </div>
      </div>

    </div>

    <div class="meta">— 互联网大厂 · 产品路演 —</div>
  </div>
</body>
</html>
