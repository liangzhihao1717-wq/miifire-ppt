<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一个人，对另一个人的信任，是立体的</title>
<link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    background: #000; color: #fff;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh;
  }
  .slide {
    width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden;
    padding: 5.2vw 9vw;
    background:
      radial-gradient(ellipse at 84% 14%, rgba(180, 150, 100, 0.07) 0%, transparent 52%),
      radial-gradient(ellipse at 8% 96%, rgba(180, 150, 100, 0.04) 0%, transparent 45%),
      #0a0a0a;
    display: flex; flex-direction: column; justify-content: center;
  }
  .brand {
    position: absolute; top: 2vw; left: 3.5vw;
    display: flex; align-items: center; gap: 0.8vw; text-decoration: none; opacity: 0.82;
  }
  .brand img { height: 2.3vw; filter: brightness(0.95) saturate(0.4); }
  .brand span { font-size: 1.15vw; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.1em; }
  .content { display: flex; flex-direction: column; }
  .eyebrow {
    font-size: 1.9vw; font-weight: 400; color: rgba(212,184,122,0.8);
    letter-spacing: 0.34em; margin-bottom: 2.6vw;
  }
  .title {
    font-size: 3.4vw; font-weight: 900; color: #e0ded5;
    letter-spacing: 0.06em; line-height: 1.3; white-space: nowrap;
    margin-bottom: 3vw;
  }
  .title .gold {
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .list { display: flex; flex-direction: column; gap: 2.3vw; }
  .pair { display: flex; align-items: center; gap: 2.2vw; white-space: nowrap; }
  .pair .seg {
    font-size: 2.05vw; font-weight: 700; color: rgba(255,255,255,0.88);
    letter-spacing: 0.05em;
  }
  .pair .seg .kw {
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    font-weight: 900;
  }
  .pair .divider {
    width: 0.1vw; height: 2.6vw; flex-shrink: 0;
    background: linear-gradient(180deg, rgba(212,184,122,0.02) 0%, rgba(212,184,122,0.65) 50%, rgba(212,184,122,0.02) 100%);
  }
  .ellipsis {
    margin-top: 2vw; font-size: 2.2vw; font-weight: 900; letter-spacing: 0.5em;
    background: linear-gradient(135deg, #e2c988 0%, #d4b87a 60%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>
  <div class="slide">
    <a href="#" class="brand"><img src="/runtime/assets/logo.png" alt="MIIFIRE"><span>觅火 MIIFIRE</span></a>
    <div class="content">
      <div class="eyebrow">内衣行业 · 短视频获客</div>
      <div class="title">一个人，对另一个人的信任，是<span class="gold">立体的</span></div>

      <div class="list">
        <div class="pair">
          <span class="seg">看这条，觉得这人人品<span class="kw">不错</span></span>
          <span class="divider"></span>
          <span class="seg">看这条，觉得这人<span class="kw">真的有货</span></span>
        </div>
        <div class="pair">
          <span class="seg">看这条，觉得这人<span class="kw">经验丰富</span></span>
          <span class="divider"></span>
          <span class="seg">看这条，觉得这人<span class="kw">资源很扎实</span></span>
        </div>
        <div class="pair">
          <span class="seg">看这条，觉得这人<span class="kw">很有匠心</span></span>
          <span class="divider"></span>
          <span class="seg">看这条，觉得这人<span class="kw">客户质量很高</span></span>
        </div>
        <div class="pair">
          <span class="seg">看这条，他这客户<span class="kw">拿到了结果</span></span>
          <span class="divider"></span>
          <span class="seg">看这条，他那个客户也<span class="kw">拿到了结果</span></span>
        </div>
      </div>

      <div class="ellipsis">······</div>
    </div>
  </div>
</body>
</html>
