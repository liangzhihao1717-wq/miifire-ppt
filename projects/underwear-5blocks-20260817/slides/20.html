<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新开店的客户</title>
<link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    background: #000; color: #fff;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh;
  }
  .slide {
    width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden;
    padding: 5.2vw 12.5vw 5.2vw 5vw;
    background:
      radial-gradient(ellipse at 84% 14%, rgba(180, 150, 100, 0.07) 0%, transparent 52%),
      radial-gradient(ellipse at 8% 96%, rgba(180, 150, 100, 0.04) 0%, transparent 45%),
      #0a0a0a;
    display: flex; flex-direction: column; justify-content: center;
  }
  .brand {
    position: absolute; top: 2vw; left: 3.5vw;
    display: flex; align-items: center; gap: 0.8vw; text-decoration: none; opacity: 0.82;
  }
  .brand img { height: 2.3vw; filter: brightness(0.95) saturate(0.4); }
  .brand span { font-size: 1.15vw; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.1em; }
  .content { display: flex; flex-direction: column; }
  .eyebrow {
    font-size: 1.9vw; font-weight: 400; color: rgba(212,184,122,0.8);
    letter-spacing: 0.34em; margin-bottom: 2vw;
  }
  .title {
    font-size: 3.9vw; font-weight: 900; color: #e0ded5;
    letter-spacing: 0.08em; line-height: 1.3; white-space: nowrap;
    margin-bottom: 3vw;
  }
  .title .gold {
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .cols { display: flex; gap: 3vw; align-items: stretch; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 2.2vw; }
  .row { display: flex; align-items: baseline; gap: 1.4vw; white-space: nowrap; }
  .row .who {
    font-size: 2vw; font-weight: 900;
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 0.06em;
  }
  .row .arrow {
    font-size: 1.6vw; color: rgba(212,184,122,0.55); font-weight: 400; flex-shrink: 0;
  }
  .row .desc {
    font-size: 1.9vw; font-weight: 600; color: rgba(255,255,255,0.88);
    letter-spacing: 0.05em;
  }
  .vline {
    width: 0.06vw; flex-shrink: 0;
    background: linear-gradient(180deg, rgba(212,184,122,0.02) 0%, rgba(212,184,122,0.4) 50%, rgba(212,184,122,0.02) 100%);
  }
</style>
</head>
<body>
  <div class="slide">
    <a href="#" class="brand"><img src="/runtime/assets/logo.png" alt="MIIFIRE"><span>觅火 MIIFIRE</span></a>
    <div class="content">
      <div class="eyebrow">代理商做短视频怎么做</div>
      <div class="title"><span class="gold">新开店</span>的客户</div>

      <div class="cols">
        <div class="col">
          <div class="row"><span class="who">内衣老板一代</span><span class="arrow">→</span><span class="desc">开新店</span></div>
          <div class="row"><span class="who">内衣老板二代</span><span class="arrow">→</span><span class="desc">开自己的店</span></div>
          <div class="row"><span class="who">厂家督导老师</span><span class="arrow">→</span><span class="desc">开自己的店</span></div>
        </div>
        <div class="vline"></div>
        <div class="col">
          <div class="row"><span class="who">代理商前员工</span><span class="arrow">→</span><span class="desc">开自己的店</span></div>
          <div class="row"><span class="who">外装店的老板</span><span class="arrow">→</span><span class="desc">想开内衣店</span></div>
          <div class="row"><span class="who">毫无经验小白</span><span class="arrow">→</span><span class="desc">想开一家店</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
