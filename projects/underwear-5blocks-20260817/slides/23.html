<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线索型短视频，不是一个，而是一组</title>
<link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    background: #000; color: #fff;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh;
  }
  .slide {
    width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden;
    padding: 5.2vw 9vw;
    background:
      radial-gradient(ellipse at 84% 14%, rgba(180, 150, 100, 0.07) 0%, transparent 52%),
      radial-gradient(ellipse at 8% 96%, rgba(180, 150, 100, 0.04) 0%, transparent 45%),
      #0a0a0a;
    display: flex; flex-direction: column; justify-content: center;
  }
  .brand {
    position: absolute; top: 2vw; left: 3.5vw;
    display: flex; align-items: center; gap: 0.8vw; text-decoration: none; opacity: 0.82;
  }
  .brand img { height: 2.3vw; filter: brightness(0.95) saturate(0.4); }
  .brand span { font-size: 1.15vw; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.1em; }
  .content { display: flex; flex-direction: column; }
  .eyebrow {
    font-size: 1.9vw; font-weight: 400; color: rgba(212,184,122,0.8);
    letter-spacing: 0.34em; margin-bottom: 2vw;
  }
  .title {
    font-size: 3.9vw; font-weight: 900; color: #e0ded5;
    letter-spacing: 0.08em; line-height: 1.3; white-space: nowrap;
    margin-bottom: 3.6vw;
  }
  .title .gold {
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 1.3vw; justify-content: center; }
  .tag {
    font-size: 1.7vw; font-weight: 900;
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 0.08em;
    border: 0.09vw solid rgba(212, 184, 122, 0.35);
    border-radius: 0.35vw;
    padding: 1vw 2.2vw;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="slide">
    <a href="#" class="brand"><img src="/runtime/assets/logo.png" alt="MIIFIRE"><span>觅火 MIIFIRE</span></a>
    <div class="content">
      <div class="eyebrow">内衣行业 · 短视频获客</div>
      <div class="title">线索型短视频，不是一个，而是<span class="gold">一组</span></div>

      <div class="tags">
        <span class="tag">痛点讲述</span>
        <span class="tag">原料筹措</span>
        <span class="tag">产品 / 服务设计</span>
        <span class="tag">价值主张</span>
        <span class="tag">客户故事</span>
        <span class="tag">稀缺证明</span>
        <span class="tag">成果证明</span>
        <span class="tag">客户证明</span>
        <span class="tag">进行时证明</span>
        <span class="tag">事件发生</span>
        <span class="tag">花絮集锦</span>
      </div>
    </div>
  </div>
</body>
</html>
