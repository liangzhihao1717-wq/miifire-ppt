<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>营销的本质</title>
<link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    background: #000; color: #fff;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh;
  }
  .slide {
    width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden;
    padding: 5.2vw 9vw;
    background:
      radial-gradient(ellipse at 84% 14%, rgba(180, 150, 100, 0.07) 0%, transparent 52%),
      radial-gradient(ellipse at 8% 96%, rgba(180, 150, 100, 0.04) 0%, transparent 45%),
      #0a0a0a;
    display: flex; flex-direction: column; justify-content: center;
  }
  .brand {
    position: absolute; top: 2vw; left: 3.5vw;
    display: flex; align-items: center; gap: 0.8vw; text-decoration: none; opacity: 0.82;
  }
  .brand img { height: 2.3vw; filter: brightness(0.95) saturate(0.4); }
  .brand span { font-size: 1.15vw; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.1em; }
  .content { display: flex; flex-direction: column; }
  .eyebrow {
    font-size: 1.9vw; font-weight: 400; color: rgba(212,184,122,0.8);
    letter-spacing: 0.34em; margin-bottom: 3vw;
  }
  .list { display: flex; flex-direction: column; gap: 2.6vw; }
  .row { display: flex; align-items: center; gap: 1.8vw; white-space: nowrap; }
  .row .no {
    font-size: 2.2vw; font-weight: 900; font-style: italic;
    background: linear-gradient(180deg, #e2c988 0%, #d4b87a 45%, #c9a050 55%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    width: 4.6vw; flex-shrink: 0;
  }
  .row .bar {
    width: 0.24vw; height: 2.6vw; flex-shrink: 0;
    background: linear-gradient(180deg, rgba(212,184,122,0.02) 0%, rgba(212,184,122,0.6) 50%, rgba(212,184,122,0.02) 100%);
  }
  .row .text {
    font-size: 2.15vw; font-weight: 700; color: rgba(255,255,255,0.88);
    letter-spacing: 0.05em;
  }
  .row .text .kw {
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    font-weight: 900;
  }
  .row.final .text {
    font-size: 2.6vw;
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    font-weight: 900;
    letter-spacing: 0.08em;
  }
  .row .who {
    font-size: 1.6vw; font-weight: 500; color: rgba(255,255,255,0.45);
    letter-spacing: 0.1em; margin-left: 0.8vw;
  }
</style>
</head>
<body>
  <div class="slide">
    <a href="#" class="brand"><img src="/runtime/assets/logo.png" alt="MIIFIRE"><span>觅火 MIIFIRE</span></a>
    <div class="content">
      <div class="eyebrow">营销的本质</div>

      <div class="list">
        <div class="row">
          <span class="no">01</span><span class="bar"></span>
          <span class="text">每一个老板，都在做「把产品<span class="kw">做出来</span>，把产品<span class="kw">卖出去</span>」</span>
        </div>
        <div class="row">
          <span class="no">02</span><span class="bar"></span>
          <span class="text">内衣是你的「<span class="kw">货源</span>」，不是你的「<span class="kw">产品</span>」，你的产品是「<span class="kw">服务</span>」</span>
        </div>
        <div class="row final">
          <span class="no">03</span><span class="bar"></span>
          <span class="text">所谓营销，就是把做产品的「过程」展现出来</span><span class="who">—— 雷军</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
