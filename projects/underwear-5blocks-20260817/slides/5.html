<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内衣实体店老板 · 拍短视频</title>
<link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
  }

  .slide {
    width: 100%;
    aspect-ratio: 16 / 9;
    position: relative;
    overflow: hidden;
    padding: 5.2vw 9vw;
    background:
      radial-gradient(ellipse at 84% 14%, rgba(180, 150, 100, 0.07) 0%, transparent 52%),
      radial-gradient(ellipse at 8% 96%, rgba(180, 150, 100, 0.04) 0%, transparent 45%),
      #0a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .brand {
    position: absolute;
    top: 2vw;
    left: 3.5vw;
    display: flex;
    align-items: center;
    gap: 0.8vw;
    text-decoration: none;
    opacity: 0.82;
  }
  .brand img { height: 2.3vw; filter: brightness(0.95) saturate(0.4); }
  .brand span {
    font-size: 1.15vw;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 0.1em;
  }

  .content { display: flex; flex-direction: column; }

  .eyebrow {
    font-size: 1.9vw;
    font-weight: 400;
    color: rgba(212, 184, 122, 0.8);
    letter-spacing: 0.34em;
    margin-bottom: 1.4vw;
  }

  .title {
    font-size: 3.9vw;
    font-weight: 900;
    color: #e0ded5;
    letter-spacing: 0.06em;
    line-height: 1.22;
    margin-bottom: 3vw;
    white-space: nowrap;
  }
  .title .gold {
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .list { display: flex; flex-direction: column; gap: 2.4vw; }

  .row { display: flex; align-items: center; gap: 1.8vw; }

  .row .no {
    font-size: 2.8vw;
    font-weight: 900;
    font-style: italic;
    background: linear-gradient(180deg, #e2c988 0%, #d4b87a 45%, #c9a050 55%, #b48b3a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.02em;
    width: 5vw;
    flex-shrink: 0;
  }

  .row .bar {
    width: 0.24vw;
    height: 2.8vw;
    flex-shrink: 0;
    background: linear-gradient(180deg, rgba(212, 184, 122, 0.02) 0%, rgba(212, 184, 122, 0.6) 50%, rgba(212, 184, 122, 0.02) 100%);
  }

  .row .body { display: flex; flex-direction: row; align-items: baseline; gap: 1.4vw; }

  .row .kw {
    font-size: 2.1vw;
    font-weight: 900;
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.16em;
    white-space: nowrap;
  }

  .row .desc {
    font-size: 2vw;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: 0.05em;
    line-height: 1.5;
    white-space: nowrap;
  }
  .row .desc em {
    font-style: normal;
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
  }
</style>
</head>
<body>
  <div class="slide">

    <a href="#" class="brand">
      <img src="/runtime/assets/logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">
      <div class="eyebrow">内衣行业 · 短视频获客</div>
      <div class="title">内衣实体店老板 · <span class="gold">拍短视频</span></div>

      <div class="list">
        <div class="row">
          <span class="no">01</span>
          <span class="bar"></span>
          <div class="body">
            <div class="kw">特点</div>
            <div class="desc"><em>低客单价</em> / <em>消费决策周期短</em> / <em>服务区域半径短</em></div>
          </div>
        </div>
        <div class="row">
          <span class="no">02</span>
          <span class="bar"></span>
          <div class="body">
            <div class="kw">核心</div>
            <div class="desc">发<em>「超级传单」</em>，抢附近几条街客户注意力</div>
          </div>
        </div>
        <div class="row">
          <span class="no">03</span>
          <span class="bar"></span>
          <div class="body">
            <div class="kw">方向</div>
            <div class="desc">着重拍<em>「个人品牌曝光」</em>短视频</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
