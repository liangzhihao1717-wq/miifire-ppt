<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每天的发生，就是选题</title>
<link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    background: #000; color: #fff;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh;
  }
  .slide {
    width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden;
    padding: 4.6vw 9vw;
    background:
      radial-gradient(ellipse at 84% 14%, rgba(180, 150, 100, 0.07) 0%, transparent 52%),
      radial-gradient(ellipse at 8% 96%, rgba(180, 150, 100, 0.04) 0%, transparent 45%),
      #0a0a0a;
    display: flex; flex-direction: column; justify-content: center;
  }
  .brand {
    position: absolute; top: 2vw; left: 3.5vw;
    display: flex; align-items: center; gap: 0.8vw; text-decoration: none; opacity: 0.82;
  }
  .brand img { height: 2.3vw; filter: brightness(0.95) saturate(0.4); }
  .brand span { font-size: 1.15vw; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.1em; }
  .content { display: flex; flex-direction: column; }
  .eyebrow {
    font-size: 1.9vw; font-weight: 400; color: rgba(212,184,122,0.8);
    letter-spacing: 0.34em; margin-bottom: 1.6vw;
  }
  .title {
    font-size: 3.6vw; font-weight: 900; color: #e0ded5;
    letter-spacing: 0.08em; line-height: 1.25; white-space: nowrap;
    margin-bottom: 2.6vw;
  }
  .title .gold {
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .list { display: flex; flex-direction: column; gap: 1.5vw; }
  .row { display: flex; align-items: baseline; gap: 1.6vw; white-space: nowrap; }
  .row .happen {
    font-size: 1.75vw; font-weight: 500; color: rgba(255,255,255,0.72);
    letter-spacing: 0.05em;
  }
  .row .arrow {
    font-size: 1.5vw; color: rgba(212,184,122,0.55); font-weight: 400; flex-shrink: 0;
  }
  .row .topic {
    font-size: 1.75vw; font-weight: 900;
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
  <div class="slide">
    <a href="#" class="brand"><img src="/runtime/assets/logo.png" alt="MIIFIRE"><span>觅火 MIIFIRE</span></a>
    <div class="content">
      <div class="eyebrow">内衣行业 · 短视频获客</div>
      <div class="title">每天的发生，就是现成的<span class="gold">选题</span></div>

      <div class="list">
        <div class="row"><span class="happen">今天有个招聘</span><span class="arrow">→</span><span class="topic">我是怎么招聘同事的</span></div>
        <div class="row"><span class="happen">今天来了一位客户</span><span class="arrow">→</span><span class="topic">我们认识十二年了</span></div>
        <div class="row"><span class="happen">我这可能是全远安最舒服的试衣间</span><span class="arrow">→</span><span class="topic">专门安装了一台空调</span></div>
        <div class="row"><span class="happen">一位导购很怕被辞退</span><span class="arrow">→</span><span class="topic">用善良的员工</span></div>
        <div class="row"><span class="happen">一位妈妈在我们店里哭了</span><span class="arrow">→</span><span class="topic">我们没推销</span></div>
        <div class="row"><span class="happen">我们有个客户总来我们店里睡午觉</span><span class="arrow">→</span><span class="topic">我特意换了遮光窗帘</span></div>
      </div>
    </div>
  </div>
</body>
</html>
