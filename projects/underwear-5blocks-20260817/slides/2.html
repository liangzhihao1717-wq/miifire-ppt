<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我只要落地</title>
<link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
  }

  .slide {
    width: 100%;
    aspect-ratio: 16 / 9;
    position: relative;
    overflow: hidden;
    padding: 5.2vw 9vw;
    background:
      radial-gradient(ellipse at 78% 28%, rgba(180, 150, 100, 0.07) 0%, transparent 55%),
      radial-gradient(ellipse at 12% 88%, rgba(180, 150, 100, 0.04) 0%, transparent 45%),
      #0a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .brand {
    position: absolute;
    top: 2vw;
    left: 3.5vw;
    display: flex;
    align-items: center;
    gap: 0.8vw;
    text-decoration: none;
    opacity: 0.82;
  }
  .brand img { height: 2.3vw; filter: brightness(0.95) saturate(0.4); }
  .brand span {
    font-size: 1.15vw;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 0.1em;
  }

  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.8vw;
  }

  .eyebrow {
    font-size: 1.9vw;
    font-weight: 400;
    color: rgba(212, 184, 122, 0.75);
    letter-spacing: 0.4em;
    margin-bottom: 1vw;
  }

  .quote-main {
    font-size: 4.6vw;
    font-weight: 900;
    color: #e0ded5;
    letter-spacing: 0.1em;
    line-height: 1.3;
    text-align: center;
    white-space: nowrap;
  }
  .quote-main .gold {
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .quote-sub {
    font-size: 2.4vw;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.82);
    letter-spacing: 0.14em;
    text-align: center;
    white-space: nowrap;
  }
  .quote-sub .gold {
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
  }
</style>
</head>
<body>
  <div class="slide">

    <a href="#" class="brand">
      <img src="/runtime/assets/logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">
      <div class="eyebrow">短视频获客 · 觅火的态度</div>
      <div class="quote-main">不听课，不学习，我只要<span class="gold">落</span></div>
      <div class="quote-sub">任凭方法再对，落不了，<span class="gold">就是割韭菜</span></div>
    </div>

  </div>
</body>
</html>
