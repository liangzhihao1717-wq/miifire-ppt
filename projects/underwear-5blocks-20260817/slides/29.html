<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短视频/直播，是每一位老板的成人大考</title>
<link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    background: #000; color: #fff;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh;
  }
  .slide {
    width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden;
    padding: 5.2vw 9vw;
    background:
      radial-gradient(ellipse at 78% 22%, rgba(180, 150, 100, 0.07) 0%, transparent 55%),
      radial-gradient(ellipse at 12% 90%, rgba(180, 150, 100, 0.04) 0%, transparent 45%),
      #0a0a0a;
    display: flex; flex-direction: column; justify-content: center;
  }
  .brand {
    position: absolute; top: 2vw; left: 3.5vw;
    display: flex; align-items: center; gap: 0.8vw; text-decoration: none; opacity: 0.82;
  }
  .brand img { height: 2.3vw; filter: brightness(0.95) saturate(0.4); }
  .brand span { font-size: 1.15vw; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.1em; }
  .content { display: flex; flex-direction: column; }
  .eyebrow {
    font-size: 1.9vw; font-weight: 400; color: rgba(212,184,122,0.8);
    letter-spacing: 0.34em; margin-bottom: 3vw;
  }
  .main {
    font-size: 3.4vw; font-weight: 900; color: #e0ded5;
    letter-spacing: 0.06em; line-height: 1.45;
  }
  .main .l1 { display: block; }
  .main .l2 { display: block; }
  .main .gold {
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .rule {
    width: 100%; height: 0.1vw;
    background: linear-gradient(90deg, rgba(212,184,122,0.45), rgba(212,184,122,0.04));
    margin: 2.8vw 0;
  }
  .warn {
    display: flex; align-items: center; gap: 1.8vw; white-space: nowrap;
  }
  .warn .tag {
    font-size: 1.9vw; font-weight: 900; flex-shrink: 0; letter-spacing: 0.1em;
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .warn .text {
    font-size: 2.6vw; font-weight: 900; color: rgba(255,255,255,0.92);
    letter-spacing: 0.08em;
  }
  .warn .text .kw {
    background: linear-gradient(135deg, #e2c988 0%, #f5e6c8 25%, #d4b87a 40%, #c9a050 50%, #d4b87a 60%, #f5e6c8 75%, #b48b3a 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    font-weight: 900;
  }
</style>
</head>
<body>
  <div class="slide">
    <a href="#" class="brand"><img src="/runtime/assets/logo.png" alt="MIIFIRE"><span>觅火 MIIFIRE</span></a>
    <div class="content">
      <div class="eyebrow">内衣行业 · 短视频获客</div>
      <div class="main">
        <span class="l1">短视频/直播，是每一位老板的<span class="gold">成人大考</span></span>
        <span class="l2">是<span class="gold">商业长跑</span></span>
      </div>
      <div class="rule"></div>
      <div class="warn">
        <span class="tag">放弃幻想</span>
        <span class="text">放弃「<span class="kw">等 / 靠 / 要</span>」心态</span>
      </div>
    </div>
  </div>
</body>
</html>
