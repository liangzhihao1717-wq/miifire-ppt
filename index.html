<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>能落地的才叫本事</title>
  <script src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/tailwindcss/3.0.23/tailwind.min.js"></script>
  <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', 'Inter', sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .slide {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16/9;
      max-height: 720px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 4rem;
      background: linear-gradient(135deg, #0d1117 0%, #0a0e13 100%);
      border-radius: 16px;
      overflow: hidden;
    }

    /* 腾讯风柔光背景 */
    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.25;
      pointer-events: none;
    }
    .glow-1 {
      width: 280px; height: 280px;
      background: #1e6fff;
      top: -80px; right: -60px;
    }
    .glow-2 {
      width: 220px; height: 220px;
      background: #7c3aed;
      bottom: 60px; left: -80px;
    }
    .glow-3 {
      width: 160px; height: 160px;
      background: #0ea5e9;
      top: 55%; left: 60%;
    }

    /* 内容层 */
    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 3rem;
    }

    /* 左侧文案区 */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* 主标题 */
    .main-title {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 0.03em;
      margin-bottom: 1.5rem;
      color: #fff;
    }
    .main-title .highlight {
      background: linear-gradient(135deg, #4da3ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* 拒绝区 */
    .reject-section {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
    }
    .reject-tag {
      font-size: 0.75rem;
      font-weight: 400;
      color: rgba(239, 68, 68, 0.6);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 20px;
      padding: 4px 14px;
      text-decoration: line-through;
      text-decoration-color: rgba(239, 68, 68, 0.3);
    }

    /* 核心主张 */
    .core-claim {
      font-size: 1.8rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.02em;
    }

    /* 右侧三卡片 */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 220px;
    }
    .pillar {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.3s ease;
    }
    .pillar:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.14);
      transform: translateX(4px);
    }
    .pillar-icon {
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .pillar-label {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }

    /* 底部注脚 */
    .footer-note {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      font-weight: 300;
      color: rgba(255,255,255,0.12);
      letter-spacing: 0.1em;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="bg-glow glow-3"></div>

    <div class="content">
      <div class="left-panel">
        <h1 class="main-title">
          1P 落不了<br>说再多都是闲的
        </h1>

        <div class="reject-section">
          <span class="reject-tag">账号定位</span>
          <span class="reject-tag">人设选题</span>
          <span class="reject-tag">流量打法</span>
          <span class="reject-tag">AI获客</span>
        </div>

        <p style="color:#9ca3af;font-size:0.85rem;font-weight:300;margin-bottom:0.8rem;">
          不要给我讲虚头巴脑的东西
        </p>

        <div class="core-claim">
          不要扯别的，我要 <span class="highlight">落</span>
        </div>
      </div>

      <div class="right-panel">
        <div class="pillar">
          <div class="pillar-icon">✍️</div>
          <div class="pillar-label">文案</div>
        </div>
        <div class="pillar">
          <div class="pillar-icon">📷</div>
          <div class="pillar-label">拍摄</div>
        </div>
        <div class="pillar">
          <div class="pillar-icon">🎬</div>
          <div class="pillar-label">剪辑</div>
        </div>
      </div>
    </div>

    <div class="footer-note">互联网大厂 · 产品路演</div>
  </div>
</body>
</html>
