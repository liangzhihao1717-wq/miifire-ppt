<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觅火 MIIFIRE 产品路演</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;

    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 6.875vw 10vw;
      background:
        radial-gradient(ellipse at 80% 30%, rgba(180,150,100,0.04) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .title {
      font-size: 4.5vw;
      font-weight: 900;
      color: #e0ded5;
      letter-spacing: 0.06em;
      margin-bottom: 1.2vw;
    }

    .title .gold {
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .question {
      font-size: 1.25vw;
      font-weight: 400;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.05em;
      margin-bottom: 3.5vw;
    }

    .formula {
      display: flex;
      align-items: center;
      gap: 1.5vw;
      margin-bottom: 2.5vw;
    }

    .formula .term {
      font-size: 2.5vw;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .formula .term.gold {
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .formula .term.dim {
      color: rgba(255,255,255,0.55);
    }

    .formula .op {
      font-size: 1.5vw;
      color: rgba(255,255,255,0.30);
      font-weight: 300;
    }

    .warning {
      font-size: 1.44vw;
      font-weight: 500;
      color: rgba(255,255,255,0.60);
      letter-spacing: 0.05em;
      margin-bottom: 3.5vw;
      line-height: 1.8;
    }

    .warning .zero {
      font-weight: 900;
      font-size: 2vw;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 25vw;
      height: 0.16vw;
      background: rgba(255,255,255,0.18);
      margin-bottom: 2.2vw;
    }

    .conclusion {
      font-size: 1.5vw;
      font-weight: 500;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
      line-height: 1.85;
    }

    .conclusion .gold {
      font-weight: 700;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 1;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="/ppt/" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">

      <div class="title">AI 是<span class="gold">杠杆</span>，不是引擎</div>

      <div class="question">为什么你只需要录音，觅火智能体就能出稿子？</div>

      <div class="formula">
        <span class="term gold">专有知识</span>
        <span class="op">×</span>
        <span class="term dim">杠杆</span>
        <span class="op">=</span>
        <span class="term dim">财富</span>
      </div>

      <div class="warning">
        如果专有知识是 <span class="zero">0</span>，杠杆再大，<span class="zero">0</span> × 任何数 = <span class="zero">0</span>
      </div>

      <div class="divider"></div>

      <div class="conclusion">
        我把我的<span class="gold">能力</span>灌注进了觅火，让它变成你的<span class="gold">杠杆</span>
      </div>

    </div>

    <div class="meta">— 互联网大厂 · 产品路演 —</div>
  </div>
</body>
</html>
