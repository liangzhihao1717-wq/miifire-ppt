<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觅火 MIIFIRE 产品路演</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;

    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 6.875vw 10vw;
      background:
        radial-gradient(ellipse at 80% 70%, rgba(180,150,100,0.04) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .columns {
      display: flex;
      gap: 3vw;
      align-items: stretch;
    }

    .col-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.6vw;
    }

    .col-divider {
      flex-shrink: 0;
      width: 0.05vw;
      background: rgba(255,255,255,0.15);
    }

    .scene-name {
      font-size: 2.25vw;
      font-weight: 900;
      letter-spacing: 0.06em;
      margin-bottom: 0.3vw;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.2vw;
    }

    .field .label {
      font-size: 0.875vw;
      font-weight: 500;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.10em;
    }

    .field .text {
      font-size: 1.31vw;
      font-weight: 400;
      color: rgba(255,255,255,0.68);
      letter-spacing: 0.04em;
      line-height: 1.7;
    }

    .field .sell {
      font-size: 1.31vw;
      font-weight: 500;
      color: rgba(255,255,255,0.82);
      letter-spacing: 0.04em;
      line-height: 1.7;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 1;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="/ppt/" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="columns">

      <div class="col-card">
        <div class="scene-name">材料验收</div>

        <div class="field">
          <div class="label">画面</div>
          <div class="text">在仓库或工地门口，拆开刚到货的材料</div>
        </div>

        <div class="field">
          <div class="label">内容</div>
          <div class="text">检查材料规格、品牌、型号是否和合同一致，发现不对当场退换</div>
        </div>

        <div class="field">
          <div class="label">传递的卖点</div>
          <div class="sell">不偷工减料，对材料有标准</div>
        </div>
      </div>

      <div class="col-divider"></div>

      <div class="col-card">
        <div class="scene-name">验收工地</div>

        <div class="field">
          <div class="label">画面</div>
          <div class="text">老板或监理站在正在施工的工地现场</div>
        </div>

        <div class="field">
          <div class="label">内容</div>
          <div class="text">逐项检查水电走线、瓷砖平整度、吊顶接缝，发现问题当场叫工人过来沟通整改</div>
        </div>

        <div class="field">
          <div class="label">传递的卖点</div>
          <div class="sell">验收标准严格，对每个细节都有要求</div>
        </div>
      </div>

    </div>

    <div class="meta">— 互联网大厂 · 产品路演 —</div>
  </div>
</body>
</html>
