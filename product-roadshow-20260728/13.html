<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觅火 MIIFIRE 产品路演</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;

    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 6.875vw 10vw;
      background:
        radial-gradient(ellipse at 80% 30%, rgba(180,150,100,0.04) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .title {
      font-size: 4vw;
      font-weight: 900;
      color: #e0ded5;
      letter-spacing: 0.06em;
      margin-bottom: 0.75vw;
    }

    .title .kw {
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 25vw;
      height: 0.16vw;
      background: rgba(255,255,255,0.18);
      margin-bottom: 2.75vw;
    }

    .question {
      font-size: 1.625vw;
      font-weight: 500;
      color: rgba(255,255,255,0.48);
      letter-spacing: 0.06em;
      margin-bottom: 2.5vw;
    }

    .items {
      display: flex;
      flex-direction: column;
      gap: 0.69vw;
      margin-bottom: 3.5vw;
      font-size: 1.44vw;
      font-weight: 400;
      color: rgba(255,255,255,0.60);
      letter-spacing: 0.04em;
      line-height: 1.8;
    }

    .items .item {
      display: flex;
      align-items: baseline;
      gap: 1vw;
    }

    .items .num {
      font-size: 0.875vw;
      font-weight: 400;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.06em;
      flex-shrink: 0;
      min-width: 1.875vw;
    }

    .items .kw {
      font-weight: 700;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .bottom {
      font-size: 2.25vw;
      font-weight: 900;
      color: #e0ded5;
      letter-spacing: 0.06em;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 1;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="/ppt/" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">

      <div class="title">你的经营场景，每天都有<span class="kw">过程</span>的发生</div>

      <div class="divider"></div>

      <div class="question">过程里有什么</div>

      <div class="items">
        <div class="item"><span class="num">01</span>有我和客户的 <span class="kw">因缘际会</span></div>
        <div class="item"><span class="num">02</span>有客户一开始的 <span class="kw">困扰 / 问题</span></div>
        <div class="item"><span class="num">03</span>有客户的 <span class="kw">疑虑 / 顾虑</span></div>
        <div class="item"><span class="num">04</span>有我的 <span class="kw">专业经验</span> 注入</div>
        <div class="item"><span class="num">05</span>有客户从模糊到明确的 <span class="kw">思维转变</span></div>
        <div class="item"><span class="num">06</span>有我的 <span class="kw">责任心</span> 服务态度</div>
        <div class="item"><span class="num">07</span>有 <span class="kw">结果</span>，有 <span class="kw">评价</span></div>
        <div class="item"><span class="num">08</span>有我的 <span class="kw">事后感受</span></div>
      </div>

      <div class="bottom">经营的过程，就是源源不断的新内容</div>

    </div>

    <div class="meta">— 互联网大厂 · 产品路演 —</div>
  </div>
</body>
</html>
