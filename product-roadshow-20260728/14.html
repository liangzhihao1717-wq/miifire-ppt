<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觅火 MIIFIRE 产品路演</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 6.875vw 12vw;
      background:
        radial-gradient(ellipse at 30% 70%, rgba(180,150,100,0.03) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 5vw;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5vw;
    }

    .title {
      font-size: 4vw;
      font-weight: 900;
      letter-spacing: 0.18em;
      background: linear-gradient(180deg,
        #e8d5a3 0%,
        #d4b87a 35%,
        #c9a050 50%,
        #d4b87a 65%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .rule {
      width: 100%;
      height: 0.04vw;
      background: rgba(212,184,122,0.20);
    }

    /* --- 列表区 --- */
    .list-grid {
      display: flex;
      gap: 0;
    }

    .list-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2vw;
    }

    .col-rule {
      flex-shrink: 0;
      width: 0.04vw;
      background: rgba(212,184,122,0.18);
      margin: 0 4vw;
    }

    .list-item {
      display: flex;
      align-items: baseline;
      gap: 1.5vw;
    }

    .list-item .num {
      flex-shrink: 0;
      font-size: 0.875vw;
      font-weight: 300;
      color: rgba(212,184,122,0.35);
      letter-spacing: 0.08em;
      min-width: 2.5vw;
    }

    .list-item .text {
      font-size: 1.44vw;
      font-weight: 400;
      color: rgba(255,255,255,0.62);
      letter-spacing: 0.08em;
      line-height: 1.6;
    }

    /* --- 横向行（每行4个并排） --- */
    .list-row {
      display: flex;
      gap: 0;
    }

    .list-row .list-item {
      flex: 1;
      justify-content: center;
    }

    .list-row .row-rule {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 0.6vw;
    }

    /* 右箭头：短金线 + 明显三角箭头 */
    .arrow-right {
      position: relative;
      width: 1.8vw;
      height: 0.06vw;
      background: rgba(212,184,122,0.55);
    }

    .arrow-right::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 0.4vw solid transparent;
      border-bottom: 0.4vw solid transparent;
      border-left: 0.5vw solid rgba(212,184,122,0.55);
    }

    /* --- 底部引语 --- */
    .quote {
      font-size: 1.25vw;
      font-weight: 400;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.08em;
      text-align: center;
      line-height: 1.8;
    }

    .quote em {
      font-style: normal;
      font-weight: 600;
      color: rgba(212,184,122,0.55);
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 0.75;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.06);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="index.html" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">

      <div class="header">
        <div class="title">讲故事的八要素</div>
      </div>

      <div class="rule"></div>

      <div class="list-row">
        <div class="list-item">
          <span class="num">01</span>
          <span class="text">稳态起点</span>
        </div>
        <div class="row-rule"><div class="arrow-right"></div></div>
        <div class="list-item">
          <span class="num">02</span>
          <span class="text">变化诱因</span>
        </div>
        <div class="row-rule"><div class="arrow-right"></div></div>
        <div class="list-item">
          <span class="num">03</span>
          <span class="text">目标障碍</span>
        </div>
        <div class="row-rule"><div class="arrow-right"></div></div>
        <div class="list-item">
          <span class="num">04</span>
          <span class="text">关键转折</span>
        </div>
      </div>

      <div class="rule"></div>

      <div class="list-row">
        <div class="list-item">
          <span class="num">05</span>
          <span class="text">变化过程</span>
        </div>
        <div class="row-rule"><div class="arrow-right"></div></div>
        <div class="list-item">
          <span class="num">06</span>
          <span class="text">新的稳态</span>
        </div>
        <div class="row-rule"><div class="arrow-right"></div></div>
        <div class="list-item">
          <span class="num">07</span>
          <span class="text">情感弧光</span>
        </div>
        <div class="row-rule"><div class="arrow-right"></div></div>
        <div class="list-item">
          <span class="num">08</span>
          <span class="text">认知演化</span>
        </div>
      </div>

      <div class="rule"></div>

      <div class="quote">
        人类有狩猎基因，人类大脑对于 <em>目标 → 障碍 → 解决</em> 结构天然成瘾
      </div>

    </div>

  </div>
</body>
</html>
