<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觅火 MIIFIRE 产品路演</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;

    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 6.875vw 10vw;
      background:
        radial-gradient(ellipse at 80% 30%, rgba(180,150,100,0.04) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .title {
      font-size: 4vw;
      font-weight: 900;
      color: #e0ded5;
      letter-spacing: 0.06em;
      margin-bottom: 1vw;
    }

    .divider {
      width: 25vw;
      height: 0.16vw;
      background: rgba(255,255,255,0.18);
      margin-bottom: 3vw;
    }

    .takeaways {
      display: flex;
      flex-direction: column;
      gap: 1.5vw;
      margin-bottom: 3vw;
    }

    .takeaway {
      display: flex;
      align-items: baseline;
      gap: 1.5vw;
    }

    .takeaway .num {
      font-size: 1.1vw;
      font-weight: 300;
      font-style: italic;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.06em;
      min-width: 2vw;
    }

    .takeaway .text {
      font-size: 1.6vw;
      font-weight: 500;
      color: rgba(255,255,255,0.68);
      letter-spacing: 0.04em;
      line-height: 1.6;
    }

    .takeaway .text .gold {
      font-weight: 700;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .closing-line {
      font-size: 1.1vw;
      font-weight: 400;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.08em;
      font-style: italic;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 1;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="index.html" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">

      <div class="title">你起身，能带走了什么</div>

      <div class="divider"></div>

      <div class="takeaways">
        <div class="takeaway">
          <span class="num">01</span>
          <span class="text">不用学专业拍剪、不用搞人设，<span class="gold">信任</span>才是你唯一正确的方向</span>
        </div>
        <div class="takeaway">
          <span class="num">02</span>
          <span class="text"><span class="gold">真实</span>远胜于专业，你的经营场景就是最好的内容矿</span>
        </div>
        <div class="takeaway">
          <span class="num">03</span>
          <span class="text">觅火 = 把我的<span class="gold">方法论</span>变成你的杠杆，你录音，它出稿</span>
        </div>
        <div class="takeaway">
          <span class="num">04</span>
          <span class="text">超级传单的信用增值是<span class="gold">涌现</span>的，齿轮一旦转起来，不认识你的人也会对你产生信任</span>
        </div>
      </div>

      <div class="closing-line">—— 认识你的人对你产生信任是种子，不认识你的人对你产生信任才是营销</div>

    </div>

  </div>
</body>
</html>
