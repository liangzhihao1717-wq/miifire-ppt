<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觅火 MIIFIRE 产品路演</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;

    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 6.875vw 10vw;
      background:
        radial-gradient(ellipse at 80% 30%, rgba(180,150,100,0.04) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .title {
      font-size: 4vw;
      font-weight: 900;
      color: #e0ded5;
      letter-spacing: 0.06em;
      margin-bottom: 0.75vw;
    }

    .title .gold {
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 25vw;
      height: 0.16vw;
      background: rgba(255,255,255,0.18);
      margin-bottom: 2.5vw;
    }

    .trait {
      font-size: 1.8vw;
      font-weight: 500;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.05em;
      margin-bottom: 2.5vw;
      line-height: 1.6;
    }

    .trait .gold {
      font-weight: 700;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5vw;
      margin-bottom: 2.5vw;
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 1.8vw;
    }

    .insight {
      font-size: 1.1vw;
      font-weight: 400;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.06em;
      font-style: italic;
    }

    .flow {
      font-size: 1.3vw;
      font-weight: 500;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.04em;
      line-height: 1.8;
    }

    .flow .gold {
      font-weight: 700;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .formula-line {
      font-size: 1.3vw;
      font-weight: 500;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.04em;
    }

    .formula-line .gold {
      font-weight: 700;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .golden {
      font-size: 2vw;
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1.5;
      text-align: left;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 1;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="index.html" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">

      <div class="title"><span class="gold">超级传单</span>的魅力</div>

      <div class="divider"></div>

      <div class="trait">
        它对信用的增值，是<span class="gold">持续叠加</span>的，是<span class="gold">涌现</span>的
      </div>

      <div class="cols">
        <div class="col">
          <div class="insight">—— 乌合之众，人，是受别人影响的</div>
          <div class="flow">
            你要让营销齿轮<span class="gold">转起来</span>，花花轿子众人抬，<br>
            人抬人高，<span class="gold">带动用户从众心理</span>，这就是流量的魅力
          </div>
        </div>
        <div class="col">
          <div class="formula-line">
            带动从众心理 = <span class="gold">大量不认识你的人对你产生信任</span>
          </div>
          <div class="flow">
            日复一日的讲故事，日复一日的发超级传单，<br>
            不断推动这个<span class="gold">齿轮</span>，不断推动用户从众心理的产生
          </div>
        </div>
      </div>

      <div class="golden">
        认识你的人对你产生信任是种子，不认识你的人对你产生信任才是营销
      </div>

    </div>

  </div>
</body>
</html>
