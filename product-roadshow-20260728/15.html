<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觅火 MIIFIRE 产品路演</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;

    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 6.875vw 10vw;
      background:
        radial-gradient(ellipse at 80% 30%, rgba(180,150,100,0.04) 0%, transparent 50%),
        #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content {
      display: flex;
      flex-direction: column;
    }

    /* ---- 流程行 ---- */
    .flow {
      display: flex;
      align-items: center;
      gap: 1.25vw;
      font-size: 2vw;
      font-weight: 900;
      color: #e0ded5;
      letter-spacing: 0.06em;
      margin-bottom: 2.5vw;
    }
    .flow .arrow {
      font-size: 1.5vw;
      color: rgba(255,255,255,0.25);
      font-weight: 300;
    }
    .flow .gold {
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ---- 推理结果 ---- */
    .inferences {
      font-size: 1.375vw;
      font-weight: 400;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.04em;
      line-height: 2;
      margin-bottom: 1.5vw;
    }

    .inferences .dot {
      color: rgba(255,255,255,0.22);
      margin: 0 0.75vw;
    }

    /* ---- 两句结论 ---- */
    .quotes {
      display: flex;
      gap: 3.75vw;
      margin-bottom: 2.5vw;
    }
    .quotes .q {
      font-size: 2.5vw;
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg,
        #e2c988 0%,
        #f5e6c8 25%,
        #d4b87a 40%,
        #c9a050 50%,
        #d4b87a 60%,
        #f5e6c8 75%,
        #b48b3a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 25vw;
      height: 0.16vw;
      background: rgba(255,255,255,0.18);
      margin-bottom: 2.5vw;
    }

    .conclusion {
      font-size: 1.56vw;
      font-weight: 500;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
      line-height: 1.85;
    }

    .conclusion em {
      font-style: normal;
      color: #d4b87a;
      font-weight: 700;
    }

    /* Logo */
    .brand {
      position: absolute;
      top: 1.8vw;
      left: 3.5vw;
      display: flex;
      align-items: center;
      gap: 0.75vw;
      opacity: 1;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .brand:hover { opacity: 1; }
    .brand img { height: 2.5vw; filter: brightness(0.95) saturate(0.4); }
    .brand span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.25vw;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.04em;
    }

    .meta {
      position: absolute;
      bottom: 2.5vw;
      left: 3.5vw;
      font-size: 0.73vw;
      font-weight: 300;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.16em;
    }
  </style>
</head>
<body>
  <div class="slide">

    <a href="/ppt/" class="brand">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
    </a>

    <div class="content">

      <div class="flow">
        <span>你做</span>
        <span class="arrow">→</span>
        <span>用户看</span>
        <span class="arrow">→</span>
        <span>用户在观看过程中自己</span>
        <span class="gold">发现 / 推理出</span>
      </div>

      <div class="inferences">
        这家店有严格的管理制度<span class="dot">·</span>
        这家店招聘员工的标准很高<span class="dot">·</span>
        这家店会主动收集和复盘客户反馈<span class="dot">·</span>
        这家店对服务细节有高标准要求<span class="dot">·</span>
        这家店的老板每天都在店里盯着
      </div>

      <div class="quotes">
        <span class="q">「这个人做事靠谱」</span>
        <span class="q">「这家店做事真讲究」</span>
      </div>

      <div class="divider"></div>

      <div class="conclusion">
        把卖点从<em>「嘴说」</em>变成<em>「眼见」</em>——让客户的信任从「<em>相信你说了什么</em>」变成「<em>相信他看到了什么</em>」。
      </div>

    </div>

    <div class="meta">— 互联网大厂 · 产品路演 —</div>
  </div>
</body>
</html>
