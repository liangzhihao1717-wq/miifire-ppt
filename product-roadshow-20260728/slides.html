<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觅火 MIIFIRE 产品路演</title>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }
    #stage {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease;
      transform-origin: center center;
      overflow: hidden;
    }

    /* 方形屏补偿：屏幕硬件把 16:9 拉伸到 1:1，CSS 预先压扁对冲 */
    #stage.square {
      transform: scaleY(0.5625);
    }

    /* ====== 帷幕加载特效 ====== */
    #curtain {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 9999;
      pointer-events: auto;
      cursor: pointer;
    }
    #curtain .panel {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: #0a0a0a;
      transition: transform 0.9s cubic-bezier(0.7, 0, 0.3, 1);
    }
    #curtain .panel.left  { left: 0; }
    #curtain .panel.right { right: 0; }

    /* 帷幕中央 Logo */
    #curtain .curtain-logo {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2vw;
      z-index: 1;
      transition: opacity 0.5s ease;
    }
    #curtain .curtain-logo img {
      height: 4vw;
      filter: brightness(0.95) saturate(0.4);
    }
    #curtain .curtain-logo span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1.6vw;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.08em;
    }
    #curtain .curtain-logo .hint {
      font-size: 0.9vw;
      font-weight: 300;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.12em;
      margin-top: 0.6vw;
    }
    #curtain.open .curtain-logo { opacity: 0; }

    /* 拉开：左帘向左、右帘向右 */
    #curtain.open .panel.left  { transform: translateX(-100%); }
    #curtain.open .panel.right { transform: translateX(100%); }
    #curtain.open::after { opacity: 0; }

    /* 动画结束后彻底隐藏 */
    #curtain.done { display: none; }

    /* 左上角隐形翻页按钮（上一页） */
    #prev-btn {
      position: fixed;
      top: 0; left: 0;
      width: 8vw; height: 8vw;
      z-index: 100;
      cursor: pointer;
      background: transparent;
      border: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 右下角隐形翻页按钮（下一页） */
    #next-btn {
      position: fixed;
      bottom: 0; right: 0;
      width: 8vw; height: 8vw;
      z-index: 100;
      cursor: pointer;
      background: transparent;
      border: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ====== 左侧抽屉页面列表 ====== */
    #drawer-container {
      position: fixed;
      top: 0; left: 0;
      height: 100%;
      z-index: 200;
    }
    #drawer-container .trigger {
      position: absolute;
      top: 0; left: 0;
      width: 20px;
      height: 100%;
      z-index: 1;
    }
    #drawer-container .panel {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 16vw;
      min-width: 220px;
      max-width: 280px;
      background: rgba(10,10,10,0.97);
      border-right: 1px solid rgba(255,255,255,0.08);
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #drawer-container:hover .panel {
      transform: translateX(0);
    }
    #drawer-container .panel-header {
      padding: 2vh 1.2vw 1.2vh;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    #drawer-container .panel-header span {
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 0.85vw;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.06em;
    }
    #drawer-container .panel-list {
      flex: 1;
      overflow-y: auto;
      padding: 1vh 0.8vw;
    }
    #drawer-container .panel-list::-webkit-scrollbar {
      width: 3px;
    }
    #drawer-container .panel-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }
    #drawer-container .drawer-item {
      padding: 0.8vh 0.6vw;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.2s ease;
      border-left: 2px solid transparent;
      margin-bottom: 0.6vh;
    }
    #drawer-container .drawer-item:hover {
      background: rgba(255,255,255,0.03);
    }
    #drawer-container .drawer-item.active {
      background: rgba(212,184,122,0.06);
      border-left-color: #d4b87a;
    }
    #drawer-container .drawer-item.active .drawer-label {
      color: #d4b87a;
      font-weight: 700;
    }
    #drawer-container .drawer-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 1px;
      border: 1px solid rgba(255,255,255,0.04);
      background: #0a0a0a;
      position: relative;
    }
    #drawer-container .drawer-thumb iframe {
      border: none;
      pointer-events: none;
      transform-origin: 0 0;
      position: absolute;
      top: 0; left: 0;
    }
    #drawer-container .drawer-thumb .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 1vw;
      font-weight: 900;
      color: rgba(255,255,255,0.06);
    }
    #drawer-container .drawer-label {
      display: block;
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 0.7vw;
      font-weight: 400;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.04em;
      padding: 0.5vh 0.2vw 0;
      transition: color 0.2s ease;
    }
    #drawer-container .drawer-item:hover .drawer-label {
      color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>

  <div id="curtain">
    <div class="panel left"></div>
    <div class="panel right"></div>
    <div class="curtain-logo">
      <img src="logo.png" alt="MIIFIRE">
      <span>觅火 MIIFIRE</span>
      <span class="hint">点击开始</span>
    </div>
  </div>

  <div id="stage"></div>
  <div id="prev-btn"></div>
  <div id="next-btn"></div>

  <div id="drawer-container">
    <div class="trigger"></div>
    <div class="panel">
      <div class="panel-header"><span>页面列表</span></div>
      <div class="panel-list" id="drawer-list"></div>
    </div>
  </div>

  <script>
    const TOTAL = 21;
    let current = 1;
    let currentStyle = null;

    const stage = document.getElementById('stage');

    // ——————————————————————————————
    // 执行层
    // ——————————————————————————————

    function fitSlide() {
      const slide = stage.querySelector('.slide');
      if (!slide) return;
      slide.style.width = '';
      slide.style.height = '';
      slide.style.transform = '';
      const sw = slide.offsetWidth;
      const sh = slide.offsetHeight;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const scale = Math.min(vw / sw, vh / sh, 1) * 0.92;
      slide.style.transform = `scale(${scale})`;
      slide.style.transformOrigin = 'center center';
    }

    let _busy = false;
    let _flipAt = 0;

    function executeFlip(p, dir) {
      current = p;
      stage.style.opacity = '0';

      fetch(p + '.html')
        .then(r => r.text())
        .then(html => {
          const doc = new DOMParser().parseFromString(html, 'text/html');

          if (currentStyle) currentStyle.remove();
          const styles = doc.querySelectorAll('style');
          let combined = '';
          styles.forEach(s => {
            combined += s.textContent.replace(/body\b/g, '#stage');
          });
          currentStyle = document.createElement('style');
          currentStyle.textContent = combined;
          document.head.appendChild(currentStyle);

          stage.innerHTML = doc.body.innerHTML;

          const brand = stage.querySelector('.brand');
          if (brand && brand.getAttribute('href') === '/ppt/') {
            brand.href = 'index.html';
          }

          fitSlide();

          updateDrawerActive();

          const slide = stage.querySelector('.slide');
          const baseTx = slide.style.transform;
          const ty = dir > 0 ? '100px' : '-100px';
          const scaleMatch = baseTx.match(/scale\(([^)]+)\)/);
          const s = scaleMatch ? parseFloat(scaleMatch[1]) : 1;

          slide.style.transition = 'none';
          slide.style.transform = `scale(${s * 0.96}) translateY(${ty})`;
          stage.style.opacity = '1';

          slide.offsetHeight;
          slide.style.transition = 'transform 0.55s cubic-bezier(0.16, 1, 0.3, 1)';
          slide.style.transform = baseTx;

          // 锁释放由 transitionend 驱动，与渲染状态严格同步
          let released = false;
          const done = () => {
            if (released) return;
            released = true;
            slide.style.transition = '';
            slide.removeEventListener('transitionend', onEnd);
            _busy = false;
          };
          const onEnd = (e) => {
            // 只响应 slide 自身的 transform 过渡，忽略子元素冒泡上来的事件
            if (e.target !== slide || e.propertyName !== 'transform') return;
            done();
          };
          slide.addEventListener('transitionend', onEnd);
          // 兜底：700ms 后强制释放，防止 transitionend 不触发
          setTimeout(done, 700);
        })
        .catch(() => {
          stage.style.opacity = '1';
          _busy = false;
        });
    }

    // ——————————————————————————————
    // 摄入层
    // ——————————————————————————————

    function requestFlip(dir, immediate) {
      if (_busy) return;
      if (!immediate) {
        const now = Date.now();
        if (now - _flipAt < 2000) return;
      }
      const p = Math.max(1, Math.min(TOTAL, current + dir));
      if (p === current) return;
      _flipAt = Date.now();
      _busy = true;
      executeFlip(p, dir);
    }

    // ——————————————————————————————
    // 事件绑定
    // ——————————————————————————————

    // 滚轮
    document.addEventListener('wheel', (e) => {
      e.preventDefault();
      requestFlip(e.deltaY > 0 ? 1 : -1);
    }, { passive: false });

    document.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key === 'ArrowUp'   || key === 'ArrowLeft'  || key === 'PageUp')   requestFlip(-1);
      if (key === 'ArrowDown' || key === 'ArrowRight' || key === 'PageDown') requestFlip(1);
      if (key === 's' || key === 'S') { e.preventDefault(); stage.classList.toggle('square'); }
    });

    // 左上角隐形按钮 → 上一页（绕过冷却，点击即翻）
    document.getElementById('prev-btn').addEventListener('click', () => {
      const curtain = document.getElementById('curtain');
      if (curtain && !curtain.classList.contains('done')) return;
      requestFlip(-1, true);
    });

    // 右下角隐形按钮 → 下一页（绕过冷却，点击即翻）
    document.getElementById('next-btn').addEventListener('click', () => {
      const curtain = document.getElementById('curtain');
      if (curtain && !curtain.classList.contains('done')) return;
      requestFlip(1, true);
    });

    let touchStartY = 0;
    document.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; });
    document.addEventListener('touchend', (e) => {
      const dy = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(dy) > 50) requestFlip(dy > 0 ? 1 : -1);
    });

    window.addEventListener('resize', fitSlide);

    // ——————————————————————————————
    // 帷幕
    // ——————————————————————————————

    function openCurtain() {
      const curtain = document.getElementById('curtain');
      if (curtain.classList.contains('open')) return;
      curtain.classList.add('open');
      setTimeout(() => { curtain.classList.add('done'); }, 1000);
    }
    document.getElementById('curtain').addEventListener('click', openCurtain);

    // ——————————————————————————————
    // 抽屉页面列表
    // ——————————————————————————————

    const drawerList = document.getElementById('drawer-list');
    const drawerItems = [];
    let _drawerLoaded = false;

    // 先生成占位结构（不含 iframe）
    for (let i = 1; i <= TOTAL; i++) {
      const item = document.createElement('div');
      item.className = 'drawer-item';
      item.dataset.page = i;

      const thumb = document.createElement('div');
      thumb.className = 'drawer-thumb';
      const placeholder = document.createElement('div');
      placeholder.className = 'placeholder';
      placeholder.textContent = i;
      thumb.appendChild(placeholder);
      item.appendChild(thumb);

      const label = document.createElement('span');
      label.className = 'drawer-label';
      label.textContent = '第 ' + i + ' 页';
      item.appendChild(label);

      item.addEventListener('click', () => {
        const curtain = document.getElementById('curtain');
        if (curtain && !curtain.classList.contains('done')) return;
        if (_busy || i === current) return;
        _flipAt = Date.now();
        _busy = true;
        executeFlip(i, i > current ? 1 : -1);
      });

      drawerList.appendChild(item);
      drawerItems.push({ el: item, thumb: thumb, placeholder: placeholder });
    }

    // 抽屉首次打开时加载缩略图（延迟避免同时加载 21 个 iframe）
    function loadDrawerThumbnails() {
      if (_drawerLoaded) return;
      _drawerLoaded = true;

      drawerItems.forEach((entry, idx) => {
        setTimeout(() => {
          const page = idx + 1;
          const iframe = document.createElement('iframe');
          iframe.src = page + '.html';
          iframe.scrolling = 'no';
          iframe.width = '1280';
          iframe.height = '720';
          entry.thumb.appendChild(iframe);

          // 按缩略图容器实际宽度计算缩放比
          const tw = entry.thumb.offsetWidth;
          if (tw > 0) {
            const scale = tw / 1280;
            iframe.style.transform = `scale(${scale})`;
            iframe.style.width = '1280px';
            iframe.style.height = '720px';
          }

          // iframe 加载完成后移除占位符
          iframe.addEventListener('load', () => {
            entry.placeholder.remove();
          });
        }, idx * 120); // 每 120ms 加载一个，避免瞬间并发
      });
    }

    // 鼠标移到左边缘触发首次加载
    document.getElementById('drawer-container').addEventListener('mouseenter', loadDrawerThumbnails);

    function updateDrawerActive() {
      drawerItems.forEach(entry => {
        entry.el.classList.toggle('active', parseInt(entry.el.dataset.page) === current);
      });
      const active = drawerList.querySelector('.drawer-item.active');
      if (active) {
        active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    // 初始化第一页高亮
    updateDrawerActive();

    // ——————————————————————————————
    // 首屏
    // ——————————————————————————————

    fetch('1.html')
      .then(r => r.text())
      .then(html => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const styles = doc.querySelectorAll('style');
        let combined = '';
        styles.forEach(s => {
          combined += s.textContent.replace(/body\b/g, '#stage');
        });
        currentStyle = document.createElement('style');
        currentStyle.textContent = combined;
        document.head.appendChild(currentStyle);
        stage.innerHTML = doc.body.innerHTML;
        fitSlide();
      });
  </script>
</body>
</html>
